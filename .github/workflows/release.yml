name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Run Test Suite
        run: |
          python -m unittest discover -s . -p "test_*.py"

      - name: Build Standalone Executable
        run: |
          pyinstaller --clean SpeakrCompanion.spec

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path releases -Force | Out-Null
          $tempPkg = "releases/SpeakrCompanion_Portable"
          New-Item -ItemType Directory -Path $tempPkg -Force | Out-Null
          Copy-Item "dist/SpeakrCompanion.exe" -Destination $tempPkg
          Copy-Item "app_icon.ico" -Destination $tempPkg
          Copy-Item "README.md" -Destination $tempPkg
          Compress-Archive -Path "$tempPkg/*" -DestinationPath "releases/SpeakrCompanion_Portable_${{ github.ref_name }}.zip"
          Remove-Item -Path $tempPkg -Recurse -Force

      - name: Compile Inno Setup Installer
        run: |
          ISCC.exe installer.iss

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: Speakr Companion ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            releases/SpeakrCompanion-Setup-*.exe
            releases/SpeakrCompanion_Portable_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
